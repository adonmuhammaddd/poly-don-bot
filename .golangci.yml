version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - revive
    - bodyclose
    - gosec
  settings:
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
